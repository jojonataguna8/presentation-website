<!DOCTYPE html>
<html>
<head>
    <title>My Presentation</title>

    <style>
        /* Every slide fills the screen */
        .slide {
            width: 100vw;
            height: 100vh;

            display: none;

            text-align: center;
            padding-top: 100px;
        }

        /* Only the slide with "active" is visible */
        .slide.active {
            display: block;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- SLIDE 1 -->
    <section class="slide active">
        <h1>FINLAND</h1>
        <p>Welcome to my presentation!</p>

        <button onclick="nextSlide()">Next →</button>
    </section>


    <!-- SLIDE 2 -->
    <section class="slide">
        <h1>EDUCATION</h1>
        <p>Finnish education is known around the world.</p>

        <button onclick="previousSlide()">← Back</button>
    </section>


    <script>
        // Find all elements with class="slide"
        const slides = document.querySelectorAll(".slide");

        // Which slide are we currently on?
        let currentSlide = 0;


        function nextSlide() {

            // Hide current slide
            slides[currentSlide].classList.remove("active");

            // Move to next slide
            currentSlide++;

            // Show next slide
            slides[currentSlide].classList.add("active");
        }


        function previousSlide() {

            // Hide current slide
            slides[currentSlide].classList.remove("active");

            // Move to previous slide
            currentSlide--;

            // Show previous slide
            slides[currentSlide].classList.add("active");
        }
    </script>

</body>
</html>
